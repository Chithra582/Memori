name: memory-fact-extractor
description: Extracts durable factual assertions, user preferences, and constraints from conversation text while redacting sensitive PII.
version: 1.0.0
parameters:
  type: object
  properties:
    text:
      type: string
      description: The raw conversational text chunk or dialogue turn to analyze.
    entity_id:
      type: string
      description: Unique identifier for the user or entity.
    process_id:
      type: string
      description: Identifier for the calling agent or process.
    redact_pii:
      type: boolean
      description: Whether to sanitize PII before extraction.
      default: true
  required:
    - text
    - entity_id
    - process_id
returns:
  type: object
  properties:
    extracted_facts:
      type: array
      items:
        type: object
        properties:
          category:
            type: string
            enum: [fact, preference, constraint, rule, relationship, event]
          content:
            type: string
          confidence:
            type: number
    status:
      type: string
      enum: [success, filtered, error]
