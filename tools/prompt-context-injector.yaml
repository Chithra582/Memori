name: prompt-context-injector
description: Synthesizes recalled memory assertions into structured context containers constrained by token budgets.
parameters:
  type: object
  properties:
    facts:
      type: array
      items:
        type: object
        properties:
          fact:
            type: string
          category:
            type: string
          score:
            type: number
      description: Array of recalled memory facts to inject.
    max_token_budget:
      type: integer
      default: 1294
      description: Upper bound on tokens allocated for injected memory blocks.
    format_style:
      type: string
      enum:
        - xml
        - markdown
        - plain
      default: xml
      description: Enclosure formatting style for prompt injection.
  required:
    - facts
