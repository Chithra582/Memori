name: vector-similarity-search
description: Performs sub-millisecond dense vector similarity search across partitioned tenant memory namespaces.
parameters:
  type: object
  properties:
    query_vector:
      type: array
      items:
        type: number
      description: The mathematical dense embedding vector representing the user prompt or query.
    entity_id:
      type: string
      description: Strict tenant namespace identifier.
    top_k:
      type: integer
      default: 10
      description: Maximum number of candidate memory matches to retrieve.
    min_similarity:
      type: number
      default: 0.78
      description: Minimum cosine similarity threshold for admission.
  required:
    - query_vector
    - entity_id
